on:
  - push
  - pull_request
jobs:
  compile-sketches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:PSRAM=opi
          sketch-paths: .
          libraries: |
            Arduino_CRC32
            - source-url: https://github.com/Seeed-Studio/Seeed_GFX.git
