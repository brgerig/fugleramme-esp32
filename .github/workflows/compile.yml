on:
  - push
  - pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [BOARD_EE02, BOARD_EE04]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Compile Sketch for EE02
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:XIAO_ESP32S3:PSRAM=opi
          sketch-paths: ./fugleramme-esp32
          cli-compile-flags: |
            - "--build-property"
            - "compiler.cpp.extra_flags=-DBOARD=${{ matrix.board }}"
            - --output-dir=${{ github.workspace }}/build_output/${{ matrix.board }}
          libraries: |
            - source-url: https://github.com/Seeed-Studio/Seeed_GFX.git
            - source-url: https://github.com/bakercp/CRC32.git
            - name: WiFiManager
      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binaries
          path: |
            **/build_output/**/*.bin
          if-no-files-found: error
  
