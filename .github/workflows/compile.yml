on:
  - push
  - pull_request
jobs:
  compile-sketches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          repository: Seeed-Studio/Seeed_GFX2
          path: ${{ github.workspace }}/libraries/Seeed_GFX2
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:PSRAM=opi
          sketch-paths: .
          libraries: |
            Arduino_CRC32
